name: Android ARM64 build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile geometry tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc/main/cpp \
            src/main/cpp/esp_geometry.cpp tests/esp_geometry_test.cpp \
            -o esp_geometry_test
      - name: Run geometry tests
        run: ./esp_geometry_test

  build:
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: platform-tools
      - name: Install CMake and NDK
        run: sdkmanager "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-esp-arm64-prototype
          path: build/libminecraft_esp.so
