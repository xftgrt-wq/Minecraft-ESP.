name: Android ARM64 build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# Keep verification and packaging in one job so the Android build cannot be
# silently omitted by a dependent-job scheduling/configuration issue.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile geometry tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc/main/cpp \
            src/main/cpp/esp_geometry.cpp tests/esp_geometry_test.cpp \
            -o esp_geometry_test

      - name: Run geometry tests
        run: ./esp_geometry_test

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up pinned Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          add-to-path: false
          link-to-sdk: true

      - name: Install CMake
        run: sdkmanager "cmake;3.22.1"

      - name: Configure ARM64
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_STL=c++_shared \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Verify native library
        run: |
          file build/libminecraft_esp.so
          "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/libminecraft_esp.so
          "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d build/libminecraft_esp.so

      - name: Package LeviLauncher mod
        run: |
          mkdir -p dist/minecraft_esp
          cp build/libminecraft_esp.so dist/minecraft_esp/libminecraft_esp.so
          cp manifest.json dist/minecraft_esp/manifest.json
          cd dist
          zip -qr minecraft_esp.levipack minecraft_esp
          unzip -l minecraft_esp.levipack

      - name: Upload native library and LeviPack
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-esp-arm64-prototype
          path: |
            build/libminecraft_esp.so
            dist/minecraft_esp.levipack
