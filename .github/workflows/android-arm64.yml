name: Android ARM64 build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: platform-tools
      - name: Install CMake and NDK
        run: sdkmanager "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Package LeviLauncher mod
        run: |
          mkdir -p dist/minecraft_esp/config
          cp build/libminecraft_esp.so dist/minecraft_esp/
          cp manifest.json dist/minecraft_esp/
          cp config/config.json config/config.schema.json dist/minecraft_esp/config/
          cd dist
          zip -r minecraft-esp-android.levipack minecraft_esp
      - name: Upload mod package
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-esp-levipack-arm64
          path: dist/minecraft-esp-android.levipack
